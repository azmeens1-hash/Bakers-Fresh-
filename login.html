<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Baker's Fresh</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth-center.css">
</head>
<body>

  <div class="auth-card">

    <div class="card-topbar">
      <span class="card-switch">
        New here? <a href="signup.html">Create account →</a>
      </span>
      <div class="card-controls">
        <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Dark / Light">
          <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:block">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button class="rtl-btn" id="rtl-btn" onclick="toggleRTL()" title="RTL / LTR">RTL</button>
      </div>
    </div>

    <!-- Brand -->
    <div class="card-brand">
      <a class="logo" href="index.html">
        <img src="Images/logo-light.png" alt="Baker's Fresh" class="logo-img logo-img--light">
        <img src="Images/logo-dark.png"  alt="Baker's Fresh" class="logo-img logo-img--dark">
      </a>
    </div>

    <div class="sec-tag">✦ Member Access</div>
    <h1 class="auth-heading">Sign <em>In</em></h1>
    <p class="auth-sub">Welcome back — enter your details to continue.</p>

    <div class="auth-msg" id="auth-msg"></div>

    <!-- Form -->
    <form id="login-form" novalidate onsubmit="handleLogin(event)">
      <div class="fg">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="your@email.com"
                 required autocomplete="email">
        </div>
      </div>
      <div class="fg">
        <label for="pw">Password</label>
        <div class="input-wrap">
          <input type="password" id="pw" placeholder="Your password"
                 required autocomplete="current-password">
          <button type="button" class="pw-eye" onclick="togglePw('pw',this)">👁️</button>
        </div>
      </div>
      <a href="#" class="auth-forgot">Forgot password?</a>
      <label class="auth-check">
        <input type="checkbox" id="remember">
        <span>Keep me signed in for 30 days</span>
      </label>
      <button type="submit" class="auth-btn" id="login-btn">Sign In ✦</button>
    </form>

    <!-- Divider -->
    <div class="auth-divider"><span>or continue with</span></div>

    <!-- Social Buttons — below form -->
    <div class="social-btns">
      <button class="social-btn" onclick="socialClick(this,'google')">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#C07828"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#C07828"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#C07828"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#C07828"/>
        </svg>
        Google
      </button>
      <button class="social-btn" onclick="socialClick(this,'facebook')">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#C07828"/>
        </svg>
        Facebook
      </button>
      <button class="social-btn" onclick="socialClick(this,'apple')">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z" fill="#C07828"/>
        </svg>
        Apple
      </button>
    </div>

  </div>

  <script src="js/auth-center.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email');
      const pw    = document.getElementById('pw');
      const btn   = document.getElementById('login-btn');
      if (!(validateField(email) & validateField(pw))) {
        showMsg('Please fill in all required fields correctly.', 'error');
        return;
      }
      btn.textContent = 'Signing in…';
      btn.classList.add('loading');
      setTimeout(() => {
        btn.textContent = '✓ Signed In!';
        btn.style.background = '#2A7A4A';
        showMsg('Welcome back! Redirecting…', 'success');
        setTimeout(() => {
          btn.textContent = 'Sign In ✦';
          btn.style.background = '';
          btn.classList.remove('loading');
          showMsg('', '');
        }, 3000);
      }, 1400);
    }
  </script>
</body>
</html>
