<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#c8873a"/>
  
  <!-- Cake base tier -->
  <rect x="14" y="40" width="36" height="12" rx="3" fill="#fff8f0"/>
  <rect x="14" y="40" width="36" height="3" rx="1.5" fill="#f0c080"/>

  <!-- Cake middle tier -->
  <rect x="18" y="29" width="28" height="12" rx="3" fill="#fff8f0"/>
  <rect x="18" y="29" width="28" height="3" rx="1.5" fill="#f0c080"/>

  <!-- Cake top tier -->
  <rect x="22" y="20" width="20" height="10" rx="3" fill="#fff8f0"/>
  <rect x="22" y="20" width="20" height="3" rx="1.5" fill="#f0c080"/>

  <!-- Candle -->
  <rect x="30" y="13" width="4" height="8" rx="1.5" fill="#e87070"/>
  <!-- Flame -->
  <ellipse cx="32" cy="11.5" rx="2" ry="3" fill="#FFD700"/>
  <ellipse cx="32" cy="12" rx="1" ry="1.8" fill="#FFA500"/>

  <!-- Dots decoration on base tier -->
  <circle cx="22" cy="46" r="1.5" fill="#c8873a"/>
  <circle cx="28" cy="46" r="1.5" fill="#c8873a"/>
  <circle cx="34" cy="46" r="1.5" fill="#c8873a"/>
  <circle cx="40" cy="46" r="1.5" fill="#c8873a"/>
</svg>
